workflows:
  ios-release:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic-app-store-connect-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.veetha
      vars:
        XCODE_WORKSPACE: "Veetha.xcworkspace"
        XCODE_SCHEME: "Veetha"
      node: 20.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Set up CocoaPods
        script: |
          cd ios
          pod install
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true