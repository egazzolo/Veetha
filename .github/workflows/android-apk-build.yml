name: Android APK Build (testing, no EAS credits)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
          expo-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --local
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veetha-Android-APK
          path: build-*.apk
          retention-days: 7
